<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Matchao website homepage preview</title>
  <desc id="description">A vector illustration of the Matchao matcha storefront, with its navigation, Fresh Pressed Matcha headline, featured matcha drink, and product card.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8d8c5"/>
      <stop offset=".52" stop-color="#79b8a0"/>
      <stop offset="1" stop-color="#d7e4c9"/>
    </linearGradient>
    <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8cf91" stop-opacity=".85"/>
      <stop offset="1" stop-color="#477858" stop-opacity=".96"/>
    </linearGradient>
    <clipPath id="hero-clip"><rect x="48" y="286" width="1104" height="416" rx="22"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#143f49" flood-opacity=".14"/>
    </filter>
