    <text x="701" y="176" font-size="13" fill="#537078">Authentic Japanese matcha, crafted from</text>
    <text x="701" y="197" font-size="13" fill="#537078">first-harvest tea leaves for calm energy</text>
    <text x="701" y="218" font-size="13" fill="#537078">and a brighter daily ritual.</text>
  </g>

