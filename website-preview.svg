      <text x="91" y="331" font-size="11" letter-spacing=".6">FIRST HARVEST</text>
      <text x="82" y="421" font-size="37" font-weight="700">A brighter kind</text>
      <text x="82" y="466" font-size="37" font-weight="700">of everyday.</text>
      <text x="84" y="494" font-size="13">Thoughtful matcha for your daily ritual.</text>
